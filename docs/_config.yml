# GitHub Pages site for the docs/ folder, using the Just the Docs theme.
# https://just-the-docs.com/docs/configuration/

title: JetPack
description: The JetPack theme from Silverlight 4, rebuilt for WPF and the web on .NET 8+.

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme

color_scheme: jetpack
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "JetPack on GitHub":
    - "https://github.com/Montago/JetPackTheme"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/Montago/JetPackTheme"
gh_edit_branch: "master"
gh_edit_source: docs
gh_edit_view_mode: "edit"

footer_content: >-
  JetPack is MIT licensed, except the Material Design Icons (Apache 2.0). See <a href="https://github.com/Montago/JetPackTheme/blob/master/NOTICE.md">NOTICE</a>.
