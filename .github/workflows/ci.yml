name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build JetPackTheme.slnx -c Release

      - name: Pack
        shell: bash
        run: |
          dotnet pack src/JetPack.Wpf/JetPack.Wpf.csproj -c Release --no-build -o artifacts
          dotnet pack src/JetPack.Web/JetPack.Web.csproj -c Release --no-build -o artifacts

      - name: jetpack.css matches its sources
        run: python tools/bundle_web_css.py --check

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*
