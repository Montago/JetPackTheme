# Publishes JetPack.Wpf when a version tag is pushed:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# - GitHub Packages (https://github.com/Montago/JetPackTheme/packages): always, using the workflow token.
# - nuget.org: only when the repository secret NUGET_API_KEY exists (an API key with push rights for
#   JetPack.Wpf). Without it the step is skipped.
# - A GitHub release with the .nupkg and .snupkg attached.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack src/JetPack.Wpf/JetPack.Wpf.csproj -c Release -o artifacts -p:Version=${{ steps.version.outputs.value }}

      - name: Push to GitHub Packages
        shell: bash
        # bash expands the glob; dotnet nuget push does not on the Windows runner
        run: |
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" --api-key "${{ github.token }}" --no-symbols --skip-duplicate
          done

      - name: Push to nuget.org
        if: env.NUGET_API_KEY != ''
        shell: bash
        run: |
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "JetPack.Wpf ${{ steps.version.outputs.value }}" --generate-notes
