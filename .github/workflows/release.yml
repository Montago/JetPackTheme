# Publishes JetPack.Wpf to nuget.org when a version tag is pushed:
#   git tag v0.1.0
#   git push origin v0.1.0
# Needs the repository secret NUGET_API_KEY (an API key from nuget.org with push rights for JetPack.Wpf).

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack src/JetPack.Wpf/JetPack.Wpf.csproj -c Release -o artifacts -p:Version=${{ steps.version.outputs.value }}

      - name: Push to nuget.org
        shell: bash
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "JetPack.Wpf ${{ steps.version.outputs.value }}" --generate-notes
