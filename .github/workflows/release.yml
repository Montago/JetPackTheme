# Publishes a package when a version tag is pushed; each package has its own version:
#   v1.2.3      JetPack.Wpf      git tag -a v1.2.3 -m "JetPack.Wpf 1.2.3"; git push origin v1.2.3
#   web-v1.2.3  JetPack.Web      git tag -a web-v1.2.3 -m "JetPack.Web 1.2.3"; git push origin web-v1.2.3
#
# - GitHub Packages (https://github.com/Montago/JetPackTheme/packages): always, using the workflow token.
# - nuget.org: with Trusted Publishing (no API key stored anywhere). Runs only when the repository
#   secret NUGET_USER holds the nuget.org profile name, and needs a Trusted Publishing policy on
#   nuget.org: owner Montago, repository JetPackTheme, workflow file release.yml. The first release of a
#   package (JetPack.Web 0.1.0) needs a policy whose scope allows new packages.
#   https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
# - A GitHub release with the .nupkg and .snupkg attached (assets are replaced if the release exists,
#   so the workflow can be re-run for the same tag). JetPack.Web releases are not marked as the latest
#   release, so the repository page keeps showing JetPack.Wpf.

name: Release

on:
  push:
    tags: ['v*.*.*', 'web-v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write # OIDC token for nuget.org Trusted Publishing

jobs:
  publish:
    runs-on: windows-latest
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Package and version from tag
        id: version
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            web-v*) echo "package=JetPack.Web" >> "$GITHUB_OUTPUT"; echo "value=${GITHUB_REF_NAME#web-v}" >> "$GITHUB_OUTPUT"; echo "latest=false" >> "$GITHUB_OUTPUT" ;;
            *)      echo "package=JetPack.Wpf" >> "$GITHUB_OUTPUT"; echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "latest=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Pack
        run: dotnet pack src/${{ steps.version.outputs.package }}/${{ steps.version.outputs.package }}.csproj -c Release -o artifacts -p:Version=${{ steps.version.outputs.value }}

      - name: Push to GitHub Packages
        shell: bash
        # bash expands the glob; dotnet nuget push does not on the Windows runner
        run: |
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" --api-key "${{ github.token }}" --no-symbols --skip-duplicate
          done

      # Exchanges the GitHub OIDC token for a nuget.org API key that is valid for one hour
      - name: nuget.org login (Trusted Publishing)
        if: env.NUGET_USER != ''
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: env.NUGET_USER != ''
        shell: bash
        run: |
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
          done

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "${{ steps.version.outputs.package }} ${{ steps.version.outputs.value }}" --generate-notes --latest=${{ steps.version.outputs.latest }}
          fi
